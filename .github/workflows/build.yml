name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q *.zip -d out
      - run: |
          cd out/UltraAI
          printf "android.useAndroidX=true\nandroid.suppressUnsupportedCompileSdk=35\norg.gradle.jvmargs=-Xmx3g\n" > gradle.properties
          sed -i 's/compileSdk = 34/compileSdk = 35/' app/build.gradle.kts
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: cd out/UltraAI && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: UltraAI-apk, path: out/UltraAI/app/build/outputs/apk/debug/app-debug.apk }
